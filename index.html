<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Imutável | Auditoria Corporativa</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="header">
      <h1>Registro Imutável</h1>
      <p>Não Confiar — Verificar</p>
    </header>
    
    <main class="container">
      <form id="form-log">
        <div class="form-group">
          <label for="input-log">Descrição do Evento Corporativo</label>
          <input type="text" id="input-log" placeholder="Ex: Acesso autorizado ao servidor financeiro principal" required autocomplete="off">
        </div>
        <button type="submit">Registrar Prova Criptográfica</button>
      </form>

      <div id="resultado-painel"></div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
